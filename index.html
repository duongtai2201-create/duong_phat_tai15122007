<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐍 Python Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    color: #55b7f5;
    font-size: 45px;
}

textarea {
    width: 100%;
    height: 400px;
    background: #020617;
    color: #e5e7eb;
    border: 2px solid #334155;
    border-radius: 15px;
    padding: 20px;
    font-size: 17px;
    font-family: Consolas, monospace;
    outline: none;
}

button {
    margin-top: 18px;
    padding: 15px 35px;
    border: none;
    border-radius: 12px;
    background: #4caf50;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

#status {
    margin-top: 20px;
    font-size: 18px;
    color: #94a3b8;
}

.box {
    margin-top: 20px;
    background: #020617;
    border: 2px solid #334155;
    border-radius: 15px;
    padding: 20px;
}

.title {
    font-size: 20px;
    margin-bottom: 10px;
}

#output {
    white-space: pre-wrap;
    font-family: Consolas, monospace;
    color: #e5e7eb;
}

#image {
    display: none;
    max-width: 100%;
    margin-top: 15px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🐍 Python Online</h1>

<textarea id="code">from PIL import Image, ImageDraw

img = Image.new("RGB", (500, 500), "white")
draw = ImageDraw.Draw(img)

# Vẽ hình tròn
draw.ellipse(
    (100, 100, 400, 400),
    fill="red"
)

# Vẽ hình vuông
draw.rectangle(
    (180, 180, 320, 320),
    fill="blue"
)

print("Đã tạo hình ảnh!")</textarea>

<br>

<button onclick="runPython()">▶ Chạy Python</button>

<div id="status">
⏳ Đang tải Python...
</div>

<div class="box">
    <div class="title">💻 Kết quả</div>
    <div id="output"></div>
    <img id="image">
</div>

</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>

<script>

let pyodide = null;

async function loadPython() {

    try {

        pyodide = await loadPyodide();

        // Tải Pillow
        await pyodide.loadPackage("pillow");

        document.getElementById("status").innerText =
            "✅ Python đã sẵn sàng!";

    } catch (error) {

        document.getElementById("status").innerText =
            "❌ Không tải được Python: " + error.message;

    }

}


async function runPython() {

    const output = document.getElementById("output");
    const image = document.getElementById("image");

    output.innerText = "";
    image.style.display = "none";
    image.src = "";

    if (!pyodide) {

        output.innerText =
            "⏳ Python vẫn đang tải, hãy đợi một chút.";

        return;
    }

    const code =
       document.getElementById("code").value;

    try {

        // Chuẩn bị môi trường Python
        pyodide.runPython(`
import sys
from io import StringIO

_output = StringIO()

sys.stdout = _output
sys.stderr = _output
        `);

        // Chạy code người dùng
        pyodide.runPython(code);

        // Lấy chữ print()
        const text = pyodide.runPython(
            "_output.getvalue()"
        );

        output.innerText = text;

        // Kiểm tra xem có biến img hay không
        const hasImage = pyodide.runPython(`
"img" in globals()
        `);

        if (hasImage) {

            const base64 = pyodide.runPython(`
import io
import base64

_buffer = io.BytesIO()

img.save(_buffer, format="PNG")

base64.b64encode(
    _buffer.getvalue()
).decode()
            `);

            image.src =
                "data:image/png;base64," + base64;

            image.style.display = "block";
        }

    } catch (error) {

        output.innerText =
            "❌ LỖI PYTHON:\\n\\n" +
            error.message;

    }
}

loadPython();

</script>

</body>
</html>
